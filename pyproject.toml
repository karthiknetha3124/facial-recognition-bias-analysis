[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fairvision-ai"
version = "0.1.0"
description = "Research platform for evaluating fairness in face-verification systems"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "License to be selected after project and dependency review" }
dependencies = [
  "streamlit>=1.40,<2",
  "opencv-contrib-python>=4.10,<5",
  "numpy>=1.26,<2",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
  "scikit-learn>=1.5,<2",
  "plotly>=5.24,<7",
  "PyYAML>=6,<7",
  "fairlearn>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
